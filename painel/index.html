<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de crises de marca</title>
<meta name="description" content="Sentimento do público no X antes, durante e depois de três crises de marca de 2025, classificado por IA generativa e validado por leitura humana.">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11,11,11,0.10);
  --band: #f0efec;
  --neg: #e34948;
  --neu: #a8a7a0;
  --pos: #2a78d6;
  --vol: #2a78d6;
  --on-neu: #0b0b0b;
  --accent-ink: #1c5cab;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --band: #232321;
    --neg: #e66767; --neu: #57564f; --pos: #3987e5; --vol: #3987e5; --on-neu: #ffffff; --accent-ink: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --band: #232321;
  --neg: #e66767; --neu: #57564f; --pos: #3987e5; --vol: #3987e5; --on-neu: #ffffff; --accent-ink: #86b6ef;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: var(--accent-ink); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; }
header h1 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; font-weight: 650; }
header p { margin: 0; color: var(--ink-2); max-width: 720px; }
.meta { font-size: 13px; color: var(--muted); margin-top: 8px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin: 24px 0 20px; border-bottom: 1px solid var(--grid); }
nav button {
  font: inherit; font-size: 14px; background: none; border: 0; color: var(--ink-2);
  padding: 10px 14px; border-bottom: 2px solid transparent; cursor: pointer; margin-bottom: -1px;
}
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
nav button:hover { color: var(--ink); }
nav button:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: -2px; }
.card {
  background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  padding: 18px 20px; margin-bottom: 16px;
}
.card h2 { font-size: 16px; margin: 0 0 2px; font-weight: 600; }
.card .sub { font-size: 13px; color: var(--ink-2); margin: 0 0 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2 > .card { margin-bottom: 0; }
.grid2 > *, .tiles > *, .card, .small-multiples > * { min-width: 0; }
.row-gap { margin-bottom: 16px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 760px) { .tiles { grid-template-columns: 1fr 1fr; } }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; }
.tile .lbl { font-size: 13px; color: var(--ink-2); }
.tile .val { font-size: 28px; font-weight: 600; line-height: 1.2; margin-top: 4px; }
.tile .det { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.contexto { color: var(--ink-2); margin: 0 0 16px; max-width: 820px; }
.pill {
  display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px;
  border: 1px solid var(--ring); color: var(--ink-2); vertical-align: middle; margin-left: 8px; font-weight: 500;
}
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 4px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.lk { width: 14px; height: 2px; display: inline-block; border-radius: 1px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .lbl-in { font-size: 12px; font-weight: 600; font-variant-numeric: normal; }
.chart .lbl-out { fill: var(--ink-2); font-size: 12px; }
.chart .phase-lbl { fill: var(--ink-2); font-size: 12px; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:focus { outline: none; }
.chart rect.mark { transition: opacity .12s; }
.dim rect.mark { opacity: .45; }
.dim rect.mark.on { opacity: 1; }
.marcos { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; }
.marcos b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
  border: 1px solid var(--ink-2); font-size: 11px; margin-right: 6px; font-weight: 600; color: var(--ink); }
#tip {
  position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 140px; display: none;
}
#tip .t { color: var(--ink-2); margin-bottom: 4px; }
#tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
#tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
#tip strong { font-variant-numeric: tabular-nums; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl-scroll { overflow-x: auto; }
details { margin-top: 10px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.aviso { border-left: 3px solid var(--neu); font-size: 13.5px; color: var(--ink-2); padding: 12px 16px; }
.aviso strong { color: var(--ink); }
.vazio { color: var(--ink-2); padding: 28px 0; text-align: center; }
.nota { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.sent-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.small-multiples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 760px) { .small-multiples { grid-template-columns: 1fr; } }
.sm h3 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
footer { font-size: 13px; color: var(--ink-2); margin-top: 28px; border-top: 1px solid var(--grid); padding-top: 16px; }
footer ul { padding-left: 18px; margin: 6px 0; }
.theme-btn { font: inherit; font-size: 12.5px; background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--ring); border-radius: 6px; padding: 4px 10px; cursor: pointer; float: right; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="theme-btn" id="tema" type="button">Tema</button>
    <h1>Crises de marca no X: o que o público disse antes, durante e depois</h1>
    <p>Três crises de 2025 (Tânia Bulhões, Colgate e Cacau Show). Uma IA generativa classificou o sentimento das publicações; uma amostra foi conferida por leitura humana.</p>
    <div class="meta" id="meta"></div>
  </header>
  <nav id="abas" role="tablist"></nav>
  <main id="conteudo"></main>
  <footer id="rodape"></footer>
</div>
<div id="tip" role="tooltip"></div>
<script src="dados.js"></script>
<script>
"use strict";
const REPO = "https://github.com/sarah-volpe/gestao-crise-rp/blob/main/";
const D = window.PAINEL || { casos: [] };
const FASE = { pre_crise: "Pré-crise", crise: "Crise", pos_crise: "Pós-crise", reinterdicao: "Reinterdição", segunda_onda: "Segunda onda" };
const SENT = [
  { k: "negativo", nome: "Negativo", cor: "var(--neg)", txt: "#ffffff" },
  { k: "neutro", nome: "Neutro", cor: "var(--neu)", txt: "var(--on-neu)" },
  { k: "positivo", nome: "Positivo", cor: "var(--pos)", txt: "#ffffff" },
];
const NS = "http://www.w3.org/2000/svg";

// ---------- utilidades ----------
const el = (tag, attrs = {}, ...filhos) => {
  const e = tag.startsWith("svg:") ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "text") e.textContent = v;
    else if (k === "class") e.setAttribute("class", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const f of filhos) if (f != null) e.append(f);
  return e;
};
const ddmm = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : "";
const ddmmaa = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "";
const pct = (a, b) => b > 0 ? a / b * 100 : null;
const fmtPct = v => v == null ? "–" : `${Math.round(v)}%`;
const fmtN = n => n == null ? "–" : n.toLocaleString("pt-BR");
const emTopico = s => s.negativo + s.neutro + s.positivo;
const ACENTOS = { fabricacao: "fabricação", preco: "preço", historico: "histórico", reacao: "reação", saude: "saúde",
  regulacao: "regulação", mudanca: "mudança", formula: "fórmula", confianca: "confiança", condicoes: "condições",
  relacao: "relação", exposicao: "exposição", midiatica: "midiática", nao: "não" };
const humano = s => String(s || "").split("_").map(p => ACENTOS[p] || p).join(" ").replace(/^./, c => c.toUpperCase());
const somaSent = lista => lista.reduce((a, d) => {
  for (const s of ["negativo", "neutro", "positivo", "fora_do_tema"]) a[s] += (d.sent ? d.sent[s] : d[s]) || 0;
  return a;
}, { negativo: 0, neutro: 0, positivo: 0, fora_do_tema: 0 });

// ---------- tooltip ----------
const tip = document.getElementById("tip");
function mostrarTip(ev, titulo, linhas) {
  tip.replaceChildren(el("div", { class: "t", text: titulo }));
  for (const l of linhas) {
    const chave = el("span", {}, l.cor ? el("span", { class: l.tipo === "linha" ? "lk" : "sw", style: `background:${l.cor}` }) : null, document.createTextNode(l.nome));
    tip.append(el("div", { class: "r" }, chave, el("strong", { text: l.valor })));
  }
  tip.style.display = "block";
  const r = ev.target.getBoundingClientRect ? ev.target.getBoundingClientRect() : null;
  const x = ev.clientX ?? (r ? r.left + r.width / 2 : 0), y = ev.clientY ?? (r ? r.top : 0);
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + "px";
  tip.style.top = Math.max(8, y - h - 12) + "px";
}
const esconderTip = () => { tip.style.display = "none"; };

// ---------- gráficos ----------
function largura(container) { return Math.max(300, container.clientWidth || 600); }

function eixoY(svg, y, w, ml, mr, max, ticks, fmt) {
  for (let i = 0; i <= ticks; i++) {
    const v = max / ticks * i, yy = y(v);
    svg.append(el("svg:line", { x1: ml, x2: w - mr, y1: yy, y2: yy, stroke: i === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    svg.append(el("svg:text", { x: ml - 6, y: yy + 4, "text-anchor": "end", text: fmt(v) }));
  }
}
function niceMax(v) {
  if (v <= 5) return 5;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

// colunas de volume diário, com faixas de fase e marcos
function graficoVolume(container, caso) {
  const dias = caso.dias, W = largura(container), H = 260, ml = 40, mr = 8, mt = 34, mb = 26;
  const n = dias.length, band = (W - ml - mr) / n, bw = Math.max(2, Math.min(24, band * 0.72));
  const max = niceMax(Math.max(1, ...dias.map(d => d.volume || 0)));
  const y = v => mt + (H - mt - mb) * (1 - v / max);
  const xi = i => ml + band * i;
  const svg = el("svg:svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Volume de publicações por dia, ${caso.nome}` });
  // faixas de fase
  for (const f of caso.fases) {
    const i0 = dias.findIndex(d => d.fase === f.nome), i1 = dias.map(d => d.fase).lastIndexOf(f.nome);
    if (i0 < 0) continue;
    if (f.nome !== "pre_crise" && f.nome !== "pos_crise")
      svg.append(el("svg:rect", { x: xi(i0), y: mt - 4, width: band * (i1 - i0 + 1), height: H - mt - mb + 4, fill: "var(--band)" }));
    svg.append(el("svg:text", { class: "phase-lbl", x: xi(i0) + 2, y: 12, text: FASE[f.nome] || f.nome }));
    if (i0 > 0) svg.append(el("svg:line", { x1: xi(i0), x2: xi(i0), y1: 2, y2: H - mb, stroke: "var(--axis)", "stroke-width": 1 }));
  }
  eixoY(svg, y, W, ml, mr, max, 4, v => fmtN(Math.round(v)));
  // marcos
  caso.marcos.forEach((m, k) => {
    const i = dias.findIndex(d => d.data === m.data);
    if (i < 0) return;
    const cx = xi(i) + band / 2;
    svg.append(el("svg:line", { x1: cx, x2: cx, y1: 24, y2: H - mb, stroke: "var(--ink-2)", "stroke-width": 1, "stroke-opacity": .5 }));
    svg.append(el("svg:circle", { cx, cy: 24, r: 8, fill: "var(--surface)", stroke: "var(--ink-2)", "stroke-width": 1 }));
    svg.append(el("svg:text", { x: cx, y: 28, "text-anchor": "middle", style: "fill:var(--ink);font-weight:600;font-size:10.5px", text: k + 1 }));
  });
  // colunas
  const g = el("svg:g");
  dias.forEach((d, i) => {
    const cx = xi(i) + band / 2;
    if (d.volume != null && d.volume > 0) {
      const top = y(d.volume), h = y(0) - top, r = Math.min(4, bw / 2, h);
      g.append(el("svg:path", { class: "mark", d: barraV(cx - bw / 2, top, bw, h, r), fill: "var(--vol)" }));
      if (d.volume_mais_de) g.append(el("svg:text", { x: cx, y: top - 4, "text-anchor": "middle", text: "+" }));
    }
    const hit = el("svg:rect", { class: "hit", x: xi(i), y: mt, width: band, height: H - mt - mb, tabindex: 0,
      "aria-label": `${ddmmaa(d.data)}: ${d.volume ?? "não coletado"} publicações` });
    const show = ev => mostrarTip(ev, `${ddmmaa(d.data)} · ${FASE[d.fase] || d.fase}`, [
      { nome: "Publicações encontradas", valor: d.coletado ? (d.volume_mais_de ? `mais de ${fmtN(d.volume)}` : fmtN(d.volume)) : "não coletado", cor: "var(--vol)" },
      { nome: "Na amostra", valor: fmtN(d.amostra) },
    ]);
    hit.addEventListener("pointermove", show); hit.addEventListener("focus", show);
    hit.addEventListener("pointerleave", esconderTip); hit.addEventListener("blur", esconderTip);
    g.append(hit);
  });
  svg.append(g);
  rotulosX(svg, dias, xi, band, H - mb + 16);
  container.replaceChildren(svg);
}
function barraV(x, y, w, h, r) {
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function rotulosX(svg, dias, xi, band, yy) {
  const passo = Math.max(1, Math.ceil(44 / band));
  dias.forEach((d, i) => {
    if (i % passo === 0) svg.append(el("svg:text", { x: xi(i) + band / 2, y: yy, "text-anchor": "middle", text: ddmm(d.data) }));
  });
}

// % negativo por dia, com linha de base da pré-crise
function graficoNegativo(container, caso) {
  const dias = caso.dias, W = largura(container), H = 220, ml = 40, mr = 8, mt = 22, mb = 26;
  const n = dias.length, band = (W - ml - mr) / n;
  const y = v => mt + (H - mt - mb) * (1 - v / 100);
  const xc = i => ml + band * i + band / 2;
  const svg = el("svg:svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Percentual de publicações negativas por dia, ${caso.nome}` });
  for (const f of caso.fases) {
    const i0 = dias.findIndex(d => d.fase === f.nome), i1 = dias.map(d => d.fase).lastIndexOf(f.nome);
    if (i0 < 0) continue;
    if (f.nome !== "pre_crise" && f.nome !== "pos_crise")
      svg.append(el("svg:rect", { x: ml + band * i0, y: mt - 4, width: band * (i1 - i0 + 1), height: H - mt - mb + 4, fill: "var(--band)" }));
    if (i0 > 0) svg.append(el("svg:line", { x1: ml + band * i0, x2: ml + band * i0, y1: mt - 4, y2: H - mb, stroke: "var(--axis)", "stroke-width": 1 }));
  }
  eixoY(svg, y, W, ml, mr, 100, 4, v => `${v}%`);
  const pre = somaSent(dias.filter(d => d.fase === "pre_crise"));
  const base = pct(pre.negativo, emTopico(pre));
  if (base != null) {
    svg.append(el("svg:line", { x1: ml, x2: W - mr, y1: y(base), y2: y(base), stroke: "var(--ink-2)", "stroke-width": 1.5 }));
    svg.append(el("svg:text", { class: "lbl-out", x: W - mr, y: y(base) - 6, "text-anchor": "end", text: `linha de base (pré-crise): ${fmtPct(base)}` }));
  }
  const pts = dias.map((d, i) => ({ i, d, n: emTopico(d.sent), v: pct(d.sent.negativo, emTopico(d.sent)) }));
  // linha com quebras onde não há amostra
  let path = "", aberto = false;
  for (const p of pts) {
    if (p.v == null) { aberto = false; continue; }
    path += `${aberto ? "L" : "M"}${xc(p.i)},${y(p.v)}`; aberto = true;
  }
  svg.append(el("svg:path", { d: path, fill: "none", stroke: "var(--neg)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  for (const p of pts) if (p.v != null)
    svg.append(el("svg:circle", { cx: xc(p.i), cy: y(p.v), r: p.n >= 5 ? 4 : 3, fill: "var(--neg)", stroke: "var(--surface)", "stroke-width": 2 }));
  // crosshair
  const cross = el("svg:line", { y1: mt - 4, y2: H - mb, stroke: "var(--ink-2)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  const area = el("svg:rect", { class: "hit", x: ml, y: mt - 4, width: W - ml - mr, height: H - mt - mb + 4, tabindex: 0,
    "aria-label": "Passe o cursor ou use as setas para ver cada dia" });
  let foco = 0;
  const mostrar = (i, ev) => {
    const p = pts[i]; cross.setAttribute("x1", xc(i)); cross.setAttribute("x2", xc(i)); cross.setAttribute("visibility", "visible");
    mostrarTip(ev, `${ddmmaa(p.d.data)} · ${FASE[p.d.fase] || p.d.fase}`, [
      { nome: "Negativas", valor: p.v == null ? "sem amostra" : fmtPct(p.v), cor: "var(--neg)", tipo: "linha" },
      { nome: "Classificadas no tema", valor: fmtN(p.n) },
    ]);
  };
  area.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width;
    foco = Math.max(0, Math.min(n - 1, Math.floor((x - ml) / band))); mostrar(foco, ev);
  });
  area.addEventListener("keydown", ev => {
    if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
    foco = Math.max(0, Math.min(n - 1, foco + (ev.key === "ArrowRight" ? 1 : -1)));
    const r = svg.getBoundingClientRect();
    mostrar(foco, { clientX: r.left + xc(foco) * r.width / W, clientY: r.top + y(pts[foco].v ?? 50) * r.height / H });
    ev.preventDefault();
  });
  const sair = () => { cross.setAttribute("visibility", "hidden"); esconderTip(); };
  area.addEventListener("pointerleave", sair); area.addEventListener("blur", sair);
  svg.append(area);
  rotulosX(svg, dias, i => ml + band * i, band, H - mb + 16);
  container.replaceChildren(svg);
}

// barras horizontais empilhadas (100% ou contagem)
function graficoEmpilhado(container, linhas, { percentual, rotuloLargura = 110, titulo }) {
  const W = largura(container), linhaH = 34, bh = 20, mr = percentual ? 8 : 40;
  const ml = Math.min(rotuloLargura, W * 0.38), H = linhas.length * linhaH + 4;
  const maxTot = Math.max(1, ...linhas.map(l => emTopico(l)));
  const escala = (W - ml - mr);
  const svg = el("svg:svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": titulo });
  linhas.forEach((l, k) => {
    const tot = emTopico(l), y0 = k * linhaH + (linhaH - bh) / 2;
    svg.append(el("svg:text", { class: "lbl-out", x: ml - 8, y: y0 + bh / 2 + 4, "text-anchor": "end", text: l.rotulo }));
    let x = ml;
    const larguraTot = percentual ? escala : escala * tot / maxTot;
    const segs = SENT.filter(s => l[s.k] > 0);
    segs.forEach((s, j) => {
      const w = tot ? larguraTot * l[s.k] / tot : 0, gap = j < segs.length - 1 ? 2 : 0, ww = Math.max(0, w - gap);
      const ultimo = j === segs.length - 1, primeiro = j === 0;
      const r = Math.min(4, ww / 2);
      const d = `M${x + (primeiro ? r : 0)},${y0}H${x + ww - (ultimo ? r : 0)}${ultimo ? `Q${x + ww},${y0} ${x + ww},${y0 + r}V${y0 + bh - r}Q${x + ww},${y0 + bh} ${x + ww - r},${y0 + bh}` : `V${y0 + bh}`}H${x + (primeiro ? r : 0)}${primeiro ? `Q${x},${y0 + bh} ${x},${y0 + bh - r}V${y0 + r}Q${x},${y0} ${x + r},${y0}` : `V${y0}`}Z`;
      const seg = el("svg:path", { d, fill: s.cor, tabindex: 0, "aria-label": `${l.rotulo}, ${s.nome}: ${l[s.k]}` });
      const rotulo = percentual ? fmtPct(pct(l[s.k], tot)) : String(l[s.k]);
      const show = ev => mostrarTip(ev, l.rotulo, [{ nome: s.nome, valor: `${l[s.k]} (${fmtPct(pct(l[s.k], tot))})`, cor: s.cor }]);
      seg.addEventListener("pointermove", show); seg.addEventListener("focus", show);
      seg.addEventListener("pointerleave", esconderTip); seg.addEventListener("blur", esconderTip);
      svg.append(seg);
      if (ww >= rotulo.length * 7.5 + 10)
        svg.append(el("svg:text", { class: "lbl-in", x: x + ww / 2, y: y0 + bh / 2 + 4, "text-anchor": "middle", style: `fill:${s.txt};pointer-events:none`, text: rotulo }));
      x += w;
    });
    if (!percentual) svg.append(el("svg:text", { class: "lbl-out", x: ml + larguraTot + 6, y: y0 + bh / 2 + 4, text: tot }));
  });
  container.replaceChildren(svg);
}

// pequeno gráfico de % negativo por fase (comparação entre casos)
function graficoFases(container, caso) {
  const W = largura(container), H = 170, ml = 36, mr = 12, mt = 16, mb = 24;
  const fases = (caso.por_fase || []).filter(f => emTopico(f) > 0);
  const y = v => mt + (H - mt - mb) * (1 - v / 100);
  const svg = el("svg:svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Negativas por fase, ${caso.nome}` });
  eixoY(svg, y, W, ml, mr, 100, 4, v => `${v}%`);
  const band = (W - ml - mr) / Math.max(1, fases.length), xc = i => ml + band * i + band / 2;
  const v = fases.map(f => pct(f.negativo, emTopico(f)));
  if (v.length) svg.append(el("svg:path", { d: v.map((p, i) => `${i ? "L" : "M"}${xc(i)},${y(p)}`).join(""), fill: "none", stroke: "var(--neg)", "stroke-width": 2 }));
  fases.forEach((f, i) => {
    svg.append(el("svg:circle", { cx: xc(i), cy: y(v[i]), r: 4.5, fill: "var(--neg)", stroke: "var(--surface)", "stroke-width": 2 }));
    svg.append(el("svg:text", { class: "lbl-out", x: xc(i), y: y(v[i]) - 10, "text-anchor": "middle", text: fmtPct(v[i]) }));
    svg.append(el("svg:text", { x: xc(i), y: H - 6, "text-anchor": "middle", text: FASE[f.fase] || f.fase }));
  });
  container.replaceChildren(svg);
}

// ---------- componentes ----------
const legendaSent = () => el("div", { class: "legend" }, ...SENT.map(s => el("span", {}, el("span", { class: "sw", style: `background:${s.cor}` }), document.createTextNode(s.nome))));
function card(titulo, sub, ...corpo) {
  return el("section", { class: "card" }, el("h2", { text: titulo }), sub ? el("p", { class: "sub", text: sub }) : null, ...corpo);
}
function tile(lbl, val, det) {
  return el("div", { class: "tile" }, el("div", { class: "lbl", text: lbl }), el("div", { class: "val", text: val }), det ? el("div", { class: "det", text: det }) : null);
}
function tabela(cab, linhas, numericas = []) {
  const t = el("table", {}, el("thead", {}, el("tr", {}, ...cab.map((c, i) => el("th", { class: numericas.includes(i) ? "n" : null, text: c })))));
  const tb = el("tbody");
  for (const l of linhas) tb.append(el("tr", {}, ...l.map((c, i) => c instanceof Node ? el("td", {}, c) : el("td", { class: numericas.includes(i) ? "n" : null, text: c ?? "–" }))));
  t.append(tb);
  return el("div", { class: "tbl-scroll" }, t);
}
const STATUS = {
  aguardando_coleta: "aguardando coleta", coletado: "coletado, aguardando classificação",
  classificacao_parcial: "classificação em andamento", classificado: "classificado",
};
const desenhos = [];
const agendar = (container, fn) => desenhos.push([container, fn]);

// ---------- visão de um caso ----------
const dias_incompletos = caso => (caso.dias || []).some(d => !d.coletado || d.parcial);
function visaoCaso(caso) {
  const raiz = el("div");
  raiz.append(el("p", { class: "contexto" }, document.createTextNode(caso.contexto + " "), el("span", { class: "pill", text: STATUS[caso.status] || caso.status })));
  if (caso.status === "aguardando_coleta") {
    raiz.append(card("Sem dados ainda", null, el("p", { class: "vazio", text: "A coleta deste caso ainda não foi feita. O painel se atualiza quando os resultados forem publicados." }),
      el("h3", { style: "font-size:14px;margin:12px 0 4px", text: "Fases previstas" }),
      tabela(["Fase", "Início", "Fim"], caso.fases.map(f => [FASE[f.nome] + (f.opcional ? " (opcional)" : ""), ddmmaa(f.inicio), ddmmaa(f.fim)])),
      el("h3", { style: "font-size:14px;margin:16px 0 4px", text: "Marcos" }),
      tabela(["Data", "Evento"], caso.marcos.map(m => [ddmmaa(m.data), m.evento]))));
    return raiz;
  }
  const avisos = [];
  if ((caso.montagem || {}).coleta_de === "legado") avisos.push("a coleta é a anterior ao protocolo (sem os filtros de idioma e retuíte na busca, sem emojis, sem a busca complementar)");
  if (dias_incompletos(caso)) avisos.push("há dias ainda não coletados ou coletados em parte");
  if (((caso.classificacao || {}).modelo || "").includes("provisorio")) avisos.push("a classificação foi feita na sessão de desenvolvimento, não em conversas novas como pede o protocolo");
  if (avisos.length) raiz.append(el("div", { class: "card aviso" }, el("strong", { text: "Resultados provisórios. " }),
    document.createTextNode("Não usar como resultado final do trabalho: " + avisos.join("; ") + ".")));
  const dias = caso.dias, totSent = somaSent(dias), classificado = emTopico(totSent) + totSent.fora_do_tema > 0;
  const volTotal = dias.reduce((a, d) => a + (d.volume || 0), 0), amostra = dias.reduce((a, d) => a + d.amostra, 0);
  const pico = dias.reduce((a, d) => (d.volume || 0) > (a.volume || 0) ? d : a, dias[0]);
  const porFase = Object.fromEntries((caso.por_fase || []).map(f => [f.fase, f]));
  const negPre = porFase.pre_crise ? pct(porFase.pre_crise.negativo, emTopico(porFase.pre_crise)) : null;
  const negCri = porFase.crise ? pct(porFase.crise.negativo, emTopico(porFase.crise)) : null;
  const k = caso.validacao && caso.validacao.sentimento;

  raiz.append(el("div", { class: "tiles" },
    tile("Publicações analisadas", fmtN(amostra), `de ${fmtN(volTotal)} encontradas na busca`),
    tile("Negativas na crise", classificado ? fmtPct(negCri) : "–",
      classificado && negPre != null && negCri != null ? `${negCri >= negPre ? "+" : "−"}${Math.abs(Math.round(negCri - negPre))} p.p. sobre a pré-crise (${fmtPct(negPre)})` : "aguardando classificação"),
    tile("Pico de volume", fmtN(pico.volume), `${ddmmaa(pico.data)} · ${FASE[pico.fase] || pico.fase}`),
    tile("Concordância IA × humano", k ? k.kappa.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "–",
      k ? `kappa de Cohen, ${k.interpretacao} (n = ${k.n})` : "validação humana pendente")));

  const cVol = el("div", { class: "chart" });
  const marcosLista = el("ol", { class: "marcos" }, ...caso.marcos.filter(m => dias.some(d => d.data === m.data))
    .map((m, i) => el("li", {}, el("b", { text: i + 1 }), document.createTextNode(`${ddmmaa(m.data)} · ${m.evento}`))));
  raiz.append(card("Volume de publicações por dia", "Total de publicações encontradas pela busca principal e complementar em cada dia (horário de Brasília). Faixa sombreada: fase de crise.", cVol, marcosLista,
    caso.dias.some(d => d.volume_mais_de) ? el("p", { class: "nota", text: "+ indica dia em que a busca atingiu o limite de leitura; o volume real é maior." }) : null));
  agendar(cVol, () => graficoVolume(cVol, caso));

  if (classificado) {
    const cNeg = el("div", { class: "chart" });
    raiz.append(card("Publicações negativas por dia", "Percentual de negativas entre as publicações da amostra que falam da marca. Dias com poucas publicações oscilam mais; o tamanho de cada dia aparece ao passar o cursor.", cNeg));
    agendar(cNeg, () => graficoNegativo(cNeg, caso));

    const cFase = el("div", { class: "chart" }), cEixo = el("div", { class: "chart" });
    const linhasFase = (caso.por_fase || []).filter(f => emTopico(f) + f.fora_do_tema > 0).map(f => ({ ...f, rotulo: FASE[f.fase] || f.fase }));
    const foraTot = totSent.fora_do_tema;
    raiz.append(el("div", { class: "grid2 row-gap" },
      card("Sentimento por fase", `Em relação à marca. Não inclui ${foraTot} publicações fora do tema (spam, homônimos, promoções).`, legendaSent(), cFase),
      card("Eixos temáticos", "Assunto principal de cada publicação, com o sentimento. Número de publicações.", legendaSent(), cEixo)));
    agendar(cFase, () => graficoEmpilhado(cFase, linhasFase, { percentual: true, rotuloLargura: 96, titulo: "Sentimento por fase" }));
    const linhasEixo = (caso.eixos || []).filter(e => emTopico(e) > 0).map(e => ({ ...e, rotulo: humano(e.eixo) }));
    agendar(cEixo, () => graficoEmpilhado(cEixo, linhasEixo, { percentual: false, rotuloLargura: 150, titulo: "Eixos temáticos" }));

    if (caso.destaques && caso.destaques.length) {
      const corDe = s => (SENT.find(x => x.k === s) || {}).cor || "var(--muted)";
      raiz.append(card("Publicações com mais engajamento", "Curtidas + respostas + reposts no dia da coleta. A justificativa é a da IA; o texto original abre no X.",
        tabela(["Data", "Sentimento", "Eixo", "Justificativa da IA", "Engaj.", ""], caso.destaques.map(p => [
          ddmmaa(p.data),
          el("span", {}, el("span", { class: "sent-dot", style: `background:${corDe(p.sentimento)}` }), document.createTextNode(humano(p.sentimento))),
          humano(p.eixo), p.justificativa, fmtN(p.engajamento),
          el("a", { href: p.link, target: "_blank", rel: "noopener", text: "abrir" }),
        ]), [4])));
    }
  }

  // validação e registro
  const v = caso.validacao;
  const blocoValid = v ? tabela(["Dimensão", "Kappa", "IC 95%", "Concordância", "Leitura", "n"],
    [["Sentimento", "sentimento"], ["Eixo temático", "eixo_tematico"], ["Ironia", "ironia"]].filter(([, c]) => v[c]).map(([nome, c]) => [
      nome, v[c].kappa.toFixed(2).replace(".", ","), `${v[c].ic95[0].toFixed(2)} a ${v[c].ic95[1].toFixed(2)}`.replaceAll(".", ","),
      fmtPct(v[c].concordancia * 100), v[c].interpretacao, fmtN(v[c].n)]), [1, 3, 5])
    : el("p", { class: "vazio", text: "A pesquisadora ainda não classificou a amostra de validação." });
  const meta = caso.classificacao || {}, mont = caso.montagem || {};
  const reg = [
    ["Modelo de IA", meta.modelo || "–"],
    ["Prompt (SHA-256)", meta.prompt_sha256 ? meta.prompt_sha256.slice(0, 16) + "…" : "–"],
    ["Classificação em", meta.ultima_classificacao ? ddmmaa(meta.ultima_classificacao.slice(0, 10)) : "–"],
    ["Coleta em", mont.coleta_ate && mont.coleta_ate !== "legado" ? ddmmaa(String(mont.coleta_ate).slice(0, 10)) : (mont.coleta_ate || "–")],
    ["Publicações excluídas", mont.posts_validos != null ? `${fmtN((mont.excluido_anuncio || 0) + (mont.excluido_retuite || 0) + (mont.excluido_idioma_nao_pt || 0))} (anúncio, retuíte, outro idioma)` : "–"],
  ];
  raiz.append(el("div", { class: "grid2 row-gap" },
    card("Validação humana", "Classificação independente de uma amostra pela pesquisadora, sem ver a resposta da IA. Kappa: até 0,20 leve; 0,21–0,40 razoável; 0,41–0,60 moderada; 0,61–0,80 substancial; acima de 0,80 quase perfeita (Landis; Koch, 1977).", blocoValid),
    card("Registro da execução", null, tabela(["Item", "Valor"], reg),
      el("p", { class: "nota" }, el("a", { href: `${REPO}metodologia/prompts_gerados/${caso.caso}_analise.md`, target: "_blank", rel: "noopener", text: "Prompt de análise" }),
        document.createTextNode(" · "), el("a", { href: `${REPO}metodologia/prompts_gerados/${caso.caso}_coleta.md`, target: "_blank", rel: "noopener", text: "Prompt de coleta" }),
        document.createTextNode(" · "), el("a", { href: `${REPO}casos/${caso.caso}.yaml`, target: "_blank", rel: "noopener", text: "Ficha do caso" })))));

  // tabela de dados (equivalente acessível dos gráficos)
  raiz.append(el("details", {}, el("summary", { text: "Ver os dados por dia em tabela" }),
    tabela(["Data", "Fase", "Encontradas", "Na amostra", "Negativas", "Neutras", "Positivas", "Fora do tema"],
      dias.map(d => [ddmmaa(d.data), FASE[d.fase] || d.fase, d.coletado ? (d.volume_mais_de ? `>${d.volume}` : fmtN(d.volume)) : "não coletado",
        fmtN(d.amostra), d.sent.negativo, d.sent.neutro, d.sent.positivo, d.sent.fora_do_tema]), [2, 3, 4, 5, 6, 7])));
  if (caso.nota_linha_de_base) raiz.append(el("p", { class: "nota", text: caso.nota_linha_de_base }));
  return raiz;
}

// ---------- visão comparativa ----------
function visaoComparativa() {
  const raiz = el("div");
  raiz.append(el("p", { class: "contexto", text: "Os três casos seguem o mesmo procedimento: mesma lógica de busca, mesmas regras de amostragem e o mesmo modelo de prompt. A comparação usa o percentual de publicações negativas entre as que falam da marca, em cada fase." }));
  const linhas = D.casos.map(c => {
    const pf = Object.fromEntries((c.por_fase || []).map(f => [f.fase, f]));
    const neg = f => pf[f] ? fmtPct(pct(pf[f].negativo, emTopico(pf[f]))) : "–";
    const am = (c.dias || []).reduce((a, d) => a + d.amostra, 0);
    const pico = (c.dias || []).reduce((a, d) => (d.volume || 0) > (a ? a.volume || 0 : -1) ? d : a, null);
    return [c.nome, STATUS[c.status] || c.status, c.dias ? fmtN(am) : "–", neg("pre_crise"), neg("crise"), neg("pos_crise"),
      pico ? `${fmtN(pico.volume)} em ${ddmm(pico.data)}` : "–",
      c.validacao && c.validacao.sentimento ? c.validacao.sentimento.kappa.toFixed(2).replace(".", ",") : "–"];
  });
  raiz.append(card("Resumo dos casos", null, tabela(["Caso", "Situação", "Publicações", "Neg. pré-crise", "Neg. crise", "Neg. pós-crise", "Pico de volume", "Kappa"], linhas, [2, 3, 4, 5, 7])));
  const sm = el("div", { class: "small-multiples" });
  for (const c of D.casos) {
    const box = el("div", { class: "sm" }, el("h3", { text: c.nome }));
    if (c.por_fase && c.por_fase.some(f => emTopico(f) > 0)) {
      const ch = el("div", { class: "chart" }); box.append(ch); agendar(ch, () => graficoFases(ch, c));
    } else box.append(el("p", { class: "vazio", text: STATUS[c.status] || "sem dados" }));
    sm.append(box);
  }
  raiz.append(card("Publicações negativas por fase", "Mesma escala (0 a 100%) nos três casos.", sm));
  return raiz;
}

// ---------- navegação ----------
const abas = [{ id: "comparacao", nome: "Comparação" }, ...D.casos.map(c => ({ id: c.caso, nome: c.nome.replace(" Total Clean Mint", "") }))];
function abrir(id) {
  if (!abas.some(a => a.id === id)) id = "comparacao";
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", String(b.dataset.id === id));
  desenhos.length = 0;
  const conteudo = id === "comparacao" ? visaoComparativa() : visaoCaso(D.casos.find(c => c.caso === id));
  document.getElementById("conteudo").replaceChildren(conteudo);
  redesenhar();
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
}
function redesenhar() { for (const [c, fn] of desenhos) if (c.isConnected) fn(); }
const nav = document.getElementById("abas");
for (const a of abas) nav.append(el("button", { role: "tab", "data-id": a.id, text: a.nome, onclick: () => abrir(a.id) }));
let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(redesenhar, 120); });
window.addEventListener("hashchange", () => abrir(location.hash.slice(1)));

// tema
const btn = document.getElementById("tema");
const temaAtual = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
btn.textContent = temaAtual() === "dark" ? "Tema claro" : "Tema escuro";
btn.addEventListener("click", () => {
  const novo = temaAtual() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = novo;
  try { localStorage.setItem("tema", novo); } catch (e) {}
  btn.textContent = novo === "dark" ? "Tema claro" : "Tema escuro";
});
try { const s = localStorage.getItem("tema"); if (s) { document.documentElement.dataset.theme = s; btn.textContent = s === "dark" ? "Tema claro" : "Tema escuro"; } } catch (e) {}

document.getElementById("meta").textContent = D.gerado_em ? `Dados atualizados em ${ddmmaa(D.gerado_em.slice(0, 10))}.` : "Sem dados publicados ainda.";
const rod = document.getElementById("rodape");
rod.append(el("strong", { text: "Como estes números foram produzidos" }),
  el("ul", {},
    el("li", { text: "Publicações públicas do X, uma busca por dia em cada fase; até 15 publicações sorteadas por dia." }),
    el("li", { text: "Classificação por IA generativa, lendo apenas o texto, sem saber a data, a fase ou o autor." }),
    el("li", { text: "Amostra conferida pela pesquisadora sem ver a resposta da IA (kappa de Cohen)." }),
    el("li", { text: "Curtidas, respostas e reposts são os do dia da coleta. Autores anonimizados; o texto das publicações não é exibido." })),
  el("p", {}, el("a", { href: REPO + "metodologia/protocolo.md", target: "_blank", rel: "noopener", text: "Protocolo completo" }),
    document.createTextNode(" · "), el("a", { href: REPO.replace("/blob/main/", ""), target: "_blank", rel: "noopener", text: "Repositório" }),
    document.createTextNode(" · TCC de Sarah Pelicon Volpe, Relações Públicas, UFPR, 2026.")));
abrir(location.hash.slice(1) || "comparacao");
